<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150">
  <style>
    .bg { fill: #05020a; rx: 8px; }
    .cell { fill: #160d26; rx: 3px; ry: 3px; transition: fill 0.2s ease; }
    .cell:hover { fill: #c084fc; }
    .active-1 { fill: #3b185f; }
    .active-2 { fill: #6b21a8; }
    .active-3 { fill: #9333ea; }
    .active-4 { fill: #c084fc; }
    .label { font-family: 'Fira Code', monospace; font-size: 12px; fill: #94a3b8; }
  </style>

  <!-- Latar Belakang Kartu -->
  <rect width="800" height="150" class="bg" />

  <!-- Label / Judul -->
  <text x="30" y="35" class="label">ilmil-sketch // arcade-contributions</text>

  <!-- Barisan Kotak Kontribusi (Grid Sederhana) -->
  <g transform="translate(30, 55)">
    <!-- Baris 1 hingga 5 (Contoh pola grid kotak) -->
    <!-- Kamu bisa sesuaikan atau duplikasi elemen rect ini sesuai kebutuhan -->
    <rect x="0" y="0" width="10" height="10" class="cell active-4" />
    <rect x="14" y="0" width="10" height="10" class="cell active-2" />
    <rect x="28" y="0" width="10" height="10" class="cell active-1" />
    <rect x="42" y="0" width="10" height="10" class="cell" />
    <rect x="56" y="0" width="10" height="10" class="cell active-3" />
    <rect x="70" y="0" width="10" height="10" class="cell active-4" />
    <rect x="84" y="0" width="10" height="10" class="cell active-1" />
    
    <!-- Baris berikutnya -->
    <rect x="0" y="14" width="10" height="10" class="cell active-1" />
    <rect x="14" y="14" width="10" height="10" class="cell active-3" />
    <rect x="28" y="14" width="10" height="10" class="cell active-4" />
    <rect x="42" y="14" width="10" height="10" class="cell active-2" />
    <rect x="56" y="14" width="10" height="10" class="cell" />
    <rect x="70" y="14" width="10" height="10" class="cell active-1" />
    <rect x="84" y="14" width="10" height="10" class="cell active-3" />

    <rect x="0" y="28" width="10" height="10" class="cell active-3" />
    <rect x="14" y="28" width="10" height="10" class="cell active-4" />
    <rect x="28" y="28" width="10" height="10" class="cell" />
    <rect x="42" y="28" width="10" height="10" class="cell active-1" />
    <rect x="56" y="28" width="10" height="10" class="cell active-4" />
    <rect x="70" y="28" width="10" height="10" class="cell active-2" />
    <rect x="84" y="28" width="10" height="10" class="cell active-1" />
  </g>
</svg>